name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
env:
  ALMIDE_TAG: v0.69.1-rc1
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.almide
          key: ${{ runner.os }}-almide-${{ env.ALMIDE_TAG }}-${{ hashFiles('almide.toml') }}
          restore-keys: ${{ runner.os }}-almide-${{ env.ALMIDE_TAG }}-
      - name: Install the Almide v0.69.1-rc1 release (checksum-verified)
        run: |
          set -euo pipefail
          base=https://github.com/almide/almide/releases/download/$ALMIDE_TAG
          curl -fsSL -o /tmp/almide-linux-x86_64.tar.gz "$base/almide-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/almide-checksums.sha256 "$base/almide-checksums.sha256"
          (cd /tmp && grep ' almide-linux-x86_64.tar.gz$' almide-checksums.sha256 | sha256sum -c -)
          tar xzf /tmp/almide-linux-x86_64.tar.gz -C /tmp
          install -D /tmp/almide-linux-x86_64/almide "$HOME/.local/bin/almide"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/almide" --version
      - name: Type-check (native CLI)
        run: almide check src/main.almd
      - name: Run tests (bone-name mapping)
        run: almide test spec/rig_normalizer_test.almd
      - name: Build native CLI
        run: |
          mkdir -p build
          almide build src/main.almd -o build/fizz-fbx-rig-normalizer
      - name: Build wasm (name->index bridge)
        run: almide build src/bridge.almd --target wasm -o build/rig.wasm
      - name: Verify wasm matches native (node)
        run: node test/wasm-smoke.mjs
