name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
env:
  ALMIDE_REV: 8ea826285e4b839c89434df8f4fa2cbfd872f7ec
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.almide
          key: ${{ runner.os }}-almide-${{ env.ALMIDE_REV }}-${{ hashFiles('almide.toml') }}
          restore-keys: ${{ runner.os }}-almide-${{ env.ALMIDE_REV }}-
      # No release carries `@export(wasm, ..., returns: address)` yet (almide/almide#4520),
      # so build the compiler at the almide develop commit that has it.
      - name: Install Almide from source
        run: cargo install --locked --git https://github.com/almide/almide --rev "$ALMIDE_REV" almide && almide --version
      - name: Type-check (native CLI)
        run: almide check src/main.almd
      - name: Run tests (bone-name mapping)
        run: almide test spec/rig_normalizer_test.almd
      - name: Build native CLI
        run: |
          mkdir -p build
          almide build src/main.almd -o build/fizz-fbx-rig-normalizer
      - name: Build wasm (name->index bridge)
        run: almide build src/bridge.almd --target wasm -o build/rig.wasm
      - name: Verify wasm matches native (node)
        run: node test/wasm-smoke.mjs
